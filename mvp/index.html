<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141914">
  <title>逆命录 · 乱星海</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="world-panel" aria-label="逆命录可探索地图">
    <div id="world-canvas" class="world-canvas"></div>
    <div class="world-vignette" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark">逆</span><div><strong>逆命录</strong><small>乱星海 · 机缘争夺</small></div></div>
      <div class="top-actions">
        <span id="mode" class="mode">离线规则模式</span>
        <div class="turn-card"><span id="turn">第 1 旬</span><small>行动 <b id="ap">3</b> 次</small></div>
        <button id="advance" class="primary compact" type="button">推进一旬 <span>→</span></button>
      </div>
    </header>

    <div class="world-top"><span class="eyebrow">可探索地图</span><strong id="world-location">地下坊市</strong><span id="world-hint" class="world-hint">点击地面移动，点击人物交谈，点击界门切换场景</span></div>

    <button class="opportunity-chip" type="button" data-open-panel="opportunity" aria-controls="map-panel"><span>机缘 · 筑基丹</span><strong><span id="owner">—</span> · <span id="price">—</span></strong><small>查看去向 ↗</small></button>

    <section id="world-person" class="world-person" aria-label="在场人物" hidden><button id="person-close" class="icon-close" type="button" aria-label="关闭人物交互">×</button><small id="world-role"></small><strong id="world-name"></strong><p id="world-goal"></p><div id="world-actions"></div></section>

    <aside id="map-panel" class="map-panel" aria-label="地图信息" hidden>
      <div class="panel-heading"><div><span class="eyebrow">逆命录 / JOURNAL</span><h2 id="panel-title">机缘</h2></div><button id="panel-close" class="icon-close" type="button" aria-label="关闭信息面板">×</button></div>
      <div class="panel-scroll">
        <section data-panel-content="opportunity" hidden><div class="pill-icon">丹</div><div class="detail-row"><span>当前持有人</span><strong id="owner-detail">—</strong></div><div class="detail-row"><span>当前售价</span><strong id="price-detail">—</strong></div><div class="detail-row"><span>传闻状态</span><strong id="dispute">—</strong></div><p id="outcome" class="outcome">机缘仍在流转。</p><p class="panel-tip">查证、合资、举报，或把交易引向黑风林。行动后可在邸报中追溯因果。</p></section>
        <section data-panel-content="self" hidden><div id="stats" class="stats"></div><div id="clues" class="clues"></div><button id="restart" class="text-button" type="button">重开此局</button></section>
        <section data-panel-content="people" hidden><p class="panel-tip">点击人物，角色会走近。也可以直接点击地图上的人物模型。</p><div id="people" class="people"></div></section>
        <section data-panel-content="actions" hidden><p class="panel-tip">这里列出当前位置可执行的行动；地图上的人物也提供相关选项。</p><div id="actions" class="action-grid"></div></section>
        <section data-panel-content="events" hidden><div id="events" class="events"></div></section>
      </div>
    </aside>

    <nav class="map-nav" aria-label="地图功能">
      <button type="button" data-open-panel="opportunity">机缘</button>
      <button type="button" data-open-panel="self">行囊</button>
      <button type="button" data-open-panel="people">人物</button>
      <button type="button" data-open-panel="actions">行动</button>
      <button type="button" data-open-panel="events">邸报</button>
    </nav>

    <section class="command-dock" aria-label="自然语言行动"><form id="command-form"><label class="sr-only" for="command">写下你的计策</label><textarea id="command" maxlength="280" rows="1" placeholder="写下计策，例如：请白芷看看这颗丹是否掺假……"></textarea><button class="primary" type="submit">执行 <span>↗</span></button></form><div id="message" class="message" role="status" aria-live="polite">点击人物交谈，或写下你的计策。</div></section>

    <div class="world-controls">WASD / 方向键移动 · 点击地面寻路 · 滚轮缩放</div>
  </main>
</body>
</html>
