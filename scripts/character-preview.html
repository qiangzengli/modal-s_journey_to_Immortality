<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>逆命录 · 角色造型验收</title><style>body{margin:0;background:#151a22;color:#e4d8bf;font:14px system-ui}canvas{display:block}header{position:absolute;left:28px;top:24px;right:28px;display:flex;align-items:center;gap:12px}h1{font-size:20px;margin:0 auto 0 0}button,select{background:#222d37;color:#eddfc1;border:1px solid #6c6556;border-radius:5px;padding:10px;cursor:pointer}footer{position:absolute;bottom:20px;left:28px;color:#98a8b2}#metrics{right:28px;left:auto}#labels{position:absolute;inset:0;pointer-events:none}#labels span{position:absolute;transform:translateX(-50%)}</style>
<header><h1>逆命录 <small>天南 · 角色造型</small></h1><select id="character" aria-label="角色"><option value="all">主要角色</option><option value="player">韩立</option><option value="ji">南宫婉</option><option value="modafu">墨大夫</option><option value="wen">王蝉</option><option value="mocaihuan">墨彩环</option><option value="lifeiyu">厉飞雨</option><option value="zhangtie">张铁</option><option value="story_jinguang">金光上人</option></select><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="detail">面部特写</button><button id="auto">自动旋转</button></header><div id="labels"></div><footer>拖动环绕 · 滚轮缩放 · 独立验收空间，不读取游戏存档</footer><footer id="metrics"></footer>
<script type="module">
import * as THREE from '/vendor/three.module.js';
import {createCultivatorActor,animateCultivator} from '/game/character-model.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#171e28');scene.fog=new THREE.Fog('#171e28',13,30);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.03,60);
scene.add(new THREE.HemisphereLight(0xd9e5f5,0x4b4037,1.6));const key=new THREE.DirectionalLight(0xffe4cc,3.2);key.position.set(-3,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.bias=-.0002;key.shadow.normalBias=.015;scene.add(key);const rim=new THREE.DirectionalLight(0xa5caff,2.5);rim.position.set(3,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,96),new THREE.MeshStandardMaterial({color:0x343b44,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const names={player:'韩立',ji:'南宫婉',modafu:'墨大夫',wen:'王蝉',mocaihuan:'墨彩环',lifeiyu:'厉飞雨',zhangtie:'张铁',story_jinguang:'金光上人'};
const actors=Object.fromEntries(Object.keys(names).map(id=>{const actor=createCultivatorActor(THREE,{id});scene.add(actor);return[id,actor]}));
let selected='all',angle=0,elevation=.04,distance=10,targetY=1.3,turning=false,drag=null;
function layout(){Object.values(actors).forEach(a=>a.visible=false);const ids=selected==='all'?['player','ji','modafu','wen']:[selected];ids.forEach((id,i)=>{const a=actors[id];a.visible=true;a.position.set((i-(ids.length-1)/2)*1.65,0,0);a.rotation.y=0;});document.querySelector('#labels').innerHTML=ids.map(id=>`<span data-character="${id}">${names[id]}</span>`).join('');distance=selected==='all'?11:5.6;targetY=1.3;angle=0;elevation=.035;}
layout();document.querySelector('#character').onchange=e=>{selected=e.target.value;layout()};document.querySelector('#front').onclick=()=>angle=0;document.querySelector('#side').onclick=()=>angle=Math.PI/2;document.querySelector('#back').onclick=()=>angle=Math.PI;document.querySelector('#detail').onclick=()=>{if(selected==='all'){selected='player';document.querySelector('#character').value=selected;layout();}distance=1.3;targetY=2.34;elevation=0;};document.querySelector('#auto').onclick=()=>turning=!turning;
renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(drag){angle+=(e.clientX-drag[0])*.009;elevation=Math.max(-.3,Math.min(.8,elevation+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]}};renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onwheel=e=>{e.preventDefault();distance=Math.max(.7,Math.min(15,distance*Math.exp(e.deltaY*.001)));};
window.onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};
let frame=0;function render(t){requestAnimationFrame(render);if(turning)angle+=.004;camera.position.set(Math.sin(angle)*distance,targetY+Math.sin(elevation)*distance,Math.cos(angle)*distance);camera.lookAt(0,targetY,0);for(const a of Object.values(actors))if(a.visible)animateCultivator(a,t/1000);renderer.render(scene,camera);for(const label of document.querySelectorAll('[data-character]')){const p=actors[label.dataset.character].position.clone().add(new THREE.Vector3(0,-.15,0)).project(camera);label.style.left=(p.x*.5+.5)*100+'%';label.style.top=(-p.y*.5+.5)*100+'%';}if(frame++%30===0)document.querySelector('#metrics').textContent=`${renderer.info.render.triangles.toLocaleString()} 三角面 · ${renderer.info.render.calls} 次绘制`;};requestAnimationFrame(render);
</script></html>
