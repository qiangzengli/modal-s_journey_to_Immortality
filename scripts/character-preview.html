<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逆命录 · 角色造型验收</title><style>body{margin:0;background:#151a22;color:#e4d8bf;font:14px system-ui}canvas{display:block}header{position:absolute;left:28px;top:24px;right:28px;display:flex;align-items:center;gap:12px}h1{font-size:20px;margin:0 auto 0 0}button,select{background:#222d37;color:#eddfc1;border:1px solid #6c6556;border-radius:5px;padding:10px;cursor:pointer}footer{position:absolute;bottom:20px;left:28px;color:#98a8b2}#metrics{right:28px;left:auto}#labels{position:absolute;inset:0;pointer-events:none}#labels span{position:absolute;transform:translateX(-50%)}header{flex-wrap:wrap;z-index:2;pointer-events:none}header>*{pointer-events:auto}header h1 small{font-size:12px;font-weight:normal;color:#9cabae}button:disabled{opacity:.4;cursor:default}#asset-panel{position:absolute;right:0;top:85px;bottom:58px;width:min(350px,45vw);box-sizing:border-box;padding:20px;background:#18232ded;border:1px solid #46515a;overflow:auto;border-radius:8px 0 0 8px}#asset-panel[hidden]{display:none}#asset-panel h2{font-size:17px;margin:0 0 10px}#asset-panel p{color:#a9bac3;font-size:12px;line-height:1.7}#asset-panel label{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:12px;color:#bfccc9}#asset-panel select,#asset-panel input{box-sizing:border-box;width:100%;padding:7px;background:#24323d;color:#eee3ca;border:1px solid #586571;border-radius:4px}#asset-panel fieldset{border:0;padding:0;margin:0}#asset-panel .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}#source-status,#import-result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.65;margin:12px 0}#source-status{padding:10px;border-left:2px solid #859e92;background:#243039}#import-result[data-error=true]{color:#ffa88f}#asset-panel button{margin:4px 3px 4px 0;padding:8px;font-size:12px}footer{font-size:12px;pointer-events:none}@media(max-width:1000px){header{ <header><h1>逆命录 <small>天南 · 角色造型</small></h1><select id="character" aria-label="角色"><option value="all">主要角色</option><option value="player">韩立</option><option value="ji">南宫婉</option><option value="modafu">墨大夫</option><option value="wen">王蝉</option><option value="mocaihuan">墨彩环</option><option value="lifeiyu">厉飞雨</option><option value="zhangtie">张铁</option><option value="story_jinguang">金光上人</option></select><button id="front">正面</button><button id="quarter">三分之四</button><button id="side">侧面</button><button id="back">背面</button><button id="bust">上半身</button><button id="detail">面部特写</button><button id="auto">自动旋转</button><select id="preview-action" aria-label="预览动作"><option value="idle">待机</option><option value="walk">行走</option><option value="attack">普通攻击</option><option value="cast">施法</option><option value="guard">防御</option><option value="hit">受击</option><option value="defeat">倒地</option></select><button id="assets" aria-expanded="false" aria-controls="asset-panel">资源接入</button></header><div id="labels"></div><footer>拖动环绕 · 滚轮缩放 · 独立验收空间，不读取游戏存档</footer><footer id="metrics"></footer>
<aside id="asset-panel" hidden aria-label="模型资源接入">
<h2>角色资源接入</h2><p>导入带骨骼的 GLB，检查比例、关节与动作。文件仅在本页读取，不上传，也不修改游戏存档。</p>
<div id="source-status" role="status"></div>
<label>本地 GLB 文件<input id="asset-file" type="file" accept=".glb"></label>
<p id="asset-info">单文件 ≤ 32 MiB，贴图须嵌入。保持天南／血色禁地时期的衣装与配色。</p>
<fieldset id="mapping" disabled>
<div class="pair"><label>人物高度<input id="asset-height" type="number" min="1" max="4" step="0.05" value="2.6"></label><label>朝向修正（度）<input id="asset-yaw" type="number" min="-360" max="360" step="15" value="0"></label></div>
<label>左臂节点<select id="joint-left"></select></label><label>右臂节点<select id="joint-right"></select></label>
<label>武器节点（韩立必填）<select id="joint-weapon"></select></label><label>位移根节点（可选）<select id="joint-root"></select></label>
<details><summary>动作片段映射</summary><div id="clip-fields"></div></details>
<button id="apply-asset" type="button">应用到当前角色</button><button id="export-asset" type="button" disabled>导出角色配置</button>
</fieldset>
<button id="reset-asset" type="button">恢复项目模型</button><div id="import-result" role="status" aria-live="polite"></div>
</aside>
