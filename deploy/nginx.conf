# The application intentionally accepts only its loopback Host and Origin.
# Validate the public Origin before translating it for the local upstream.
map $http_origin $niminglu_origin {
    default "invalid";
    "" "";
    "http://139.196.175.138" "http://127.0.0.1:4177";
    "http://139.196.175.138:80" "http://127.0.0.1:4177";
}

server {
    listen 80;
    listen [::]:80;
    server_name 139.196.175.138;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    access_log /var/log/nginx/niminglu-access.log;
    error_log /var/log/nginx/niminglu-error.log;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Keep the original default site's static root available.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /niminglu {
        return 308 /niminglu/$is_args$args;
    }

    location ^~ /niminglu/ {
        if ($niminglu_origin = "invalid") { return 403; }
        # Strip the public prefix; the local application still runs at /.
        proxy_pass http://127.0.0.1:4177/;
        proxy_redirect / /niminglu/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4177;
        proxy_set_header Origin $niminglu_origin;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
